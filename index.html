<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Ranking Market Simulator</h1>
    <button id="google-login-btn" class="btn-secondary">Modo Editor (Google)</button>
  </header>

  <!-- Panel Editor -->
  <section id="editor-section" class="hidden panel">
    <div class="editor-header">
      <h2>Creador de Mercados Predictivos</h2>
      <button id="logout-btn" class="btn-danger">Cerrar Sesión</button>
    </div>

    <!-- Integración con Spotify (Solo Recientes y Búsqueda) -->
    <div class="spotify-integration">
      <button id="spotify-login-btn" class="btn-spotify">Conectar con Spotify API</button>

      <div id="spotify-controls" class="hidden">
        <div class="tabs">
          <button id="tab-recent-tracks" class="tab-btn active">Canciones Recientes</button>
          <button id="tab-search" class="tab-btn">Buscador General</button>
        </div>
        <input type="text" id="spotify-search-input" class="hidden" placeholder="Buscar artista o canción sin sesgo...">
        <div id="spotify-results-list" class="results-list"></div>
      </div>
    </div>

    <!-- Constructor de Mercado Multi-Opción -->
    <div id="market-builder" class="form-group">
      <input type="text" id="market-title" placeholder="Pregunta del mercado (ej. ¿Cuál será la canción más reproducida este mes?)">

      <h3>Opciones seleccionadas</h3>
      <div id="selected-options-list" class="selected-list">
        <p class="empty-hint">Selecciona canciones o artistas de la lista superior para añadirlos a este mercado.</p>
      </div>

      <!-- Previsualización gráfica de la distribución -->
      <div class="distribution-preview">
        <div class="dist-header">
          <span>Distribución de Probabilidad:</span>
          <span id="total-prob-indicator" class="prob-invalid">Total: 0% / 100%</span>
        </div>
        <div id="distribution-bar" class="multi-progress-bar"></div>
      </div>

      <button id="confirm-publish-btn" class="btn-primary" disabled>Publicar Mercado (Debe sumar 100%)</button>
    </div>
  </section>

  <!-- Tablero Público en Tiempo Real -->
  <main id="markets-grid" class="grid-container"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
